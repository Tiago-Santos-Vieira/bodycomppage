<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BodyComp</title>
    
    <!-- Otimizacao Critical Render Path: Preload da imagem LCP (Mockup e Logo) -->
    <link rel="preload" as="image" href="https://i.postimg.cc/jSR90w0Z/Body-Comp-(2500-x-1080-px).webp" fetchpriority="high" />
    <link rel="preload" as="image" href="https://i.postimg.cc/hPhmHg8G/Captura-de-tela-2026-05-07-175505.webp" fetchpriority="high" />

    <style>
      /* Critical CSS Inline */
      body { margin: 0; padding: 0; background-color: #fcfcfc; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { display: flex; flex-direction: column; min-height: 100vh; }
      .bg-background { background-color: #fcfcfc; }
      nav.bg-white { background-color: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Scripts de terceiros atrasados (Lazy execution) para baixar TBT -->
    <script>
      window.onload = function() {
        setTimeout(function() {
          window.pixelId = "6a0e046aae0123d733f13e48";
          var a = document.createElement("script");
          a.setAttribute("async", "");
          a.setAttribute("defer", "");
          a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
          document.body.appendChild(a);

          var b = document.createElement("script");
          b.setAttribute("async", "");
          b.setAttribute("defer", "");
          b.setAttribute("src", "https://cdn.utmify.com.br/scripts/utms/latest.js");
          b.setAttribute("data-utmify-prevent-xcod-sck", "");
          b.setAttribute("data-utmify-prevent-subids", "");
          document.body.appendChild(b);
        }, 3000); // Executa somente 3s após o carregamento principal (Reduz carga inicial drasticamente)
      };
    </script>
  </body>
</html>
