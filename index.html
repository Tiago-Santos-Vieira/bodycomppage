<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BodyComp</title>
    
    <!-- Otimizacao Critical Render Path: Preload da imagem LCP (Mockup) -->
    <link rel="preload" as="image" href="https://i.postimg.cc/hPhmHg8G/Captura-de-tela-2026-05-07-175505.webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"></noscript>

    <style>
      /* Critical CSS Inline */
      body { margin: 0; padding: 0; background-color: #fcfcfc; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { display: flex; flex-direction: column; min-height: 100vh; }
      .bg-background { background-color: #fcfcfc; }
      nav.bg-white { background-color: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Scripts de terceiros atrasados (Lazy execution) para baixar TBT -->
    <script>
      function loadScripts() {
        if (window.scriptsLoaded) return;
        window.scriptsLoaded = true;
        
        window.pixelId = "6a0e046aae0123d733f13e48";
        var a = document.createElement("script");
        a.setAttribute("async", "true");
        a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
        document.body.appendChild(a);

        var b = document.createElement("script");
        b.setAttribute("async", "true");
        b.setAttribute("src", "https://cdn.utmify.com.br/scripts/utms/latest.js");
        b.setAttribute("data-utmify-prevent-xcod-sck", "");
        b.setAttribute("data-utmify-prevent-subids", "");
        document.body.appendChild(b);
      }

      ['scroll', 'mousemove', 'touchstart'].forEach(function(event) {
        window.addEventListener(event, loadScripts, { once: true });
      });
      
      // Fallback em 8 segundos
      setTimeout(loadScripts, 8000);
    </script>
  </body>
</html>
