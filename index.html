    <div id="root"><div class="bg-nodes"><div class="node"></div><div class="node"></div><div class="node"></div></div><main class="app-container"><div class="topbar" style="justify-content:center"><img src="/logo-horizontal.webp" alt="BodyComp - Nutrição Inteligente" class="brand-logo lg" width="405" height="96"></div><section class="card center"><span class="eyebrow"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg> Diagnóstico gratuito</span><h1 class="title">Você está pagando <span class="hl">aluguel</span> pelo seu próprio consultório?</h1><p class="lead" style="margin-top:12px">Mensalidade de software, planilha solta e dieta montada na mão comem seu lucro e seu tempo. Responda 6 perguntas e veja quanto isso já te custou.</p><div class="hero-photo"><img src="/quiz/inicio.webp" alt="Nutricionista frustrada com papéis, planilhas e cobranças no consultório" width="1200" height="670" fetchpriority="high"></div><button class="btn-primary pulse" onclick="window.__quizClick=true">Quero ver meu diagnóstico <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button><div class="trust-row"><span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> 6 perguntas</span><span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg> Menos de 1 minuto</span><span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Resultado na hora</span></div></section></main></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Meta Pixel: mesmo conjunto de dados que a Kiwify usa no checkout (Pixel Kiwify BodyCompp) -->
    <script>
      window.metaPixelId = "26887854514238733";

      // Fila do fbq criada na hora: os eventos esperam aqui até a biblioteca carregar
      !function(f){if(f.fbq)return;var n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[]}(window);
      fbq('init', window.metaPixelId);
      fbq('track', 'PageView');

      // Scripts de terceiros atrasados (Lazy execution) para baixar TBT
      function loadScripts() {
        if (window.scriptsLoaded) return;
        window.scriptsLoaded = true;
        // Não manda eventos de testes locais para o pixel
        if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;

        var a = document.createElement("script");
        a.setAttribute("async", "true");
        a.setAttribute("src", "https://connect.facebook.net/en_US/fbevents.js");
        document.body.appendChild(a);
      }

      ['scroll', 'mousemove', 'touchstart', 'click'].forEach(function(event) {
        window.addEventListener(event, loadScripts, { once: true });
      });

      // Fallback em 3 segundos (curto para não perder o PageView de quem sai rápido)
      setTimeout(loadScripts, 3000);
    </script>
    <noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=26887854514238733&ev=PageView&noscript=1" /></noscript>
